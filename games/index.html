<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Phaser Examples</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: monospace;
      /* background-color: #ffffff; */
      background: radial-gradient(black 15%, transparent 16%) 0 0, radial-gradient(black 15%, transparent 16%) 8px 8px, radial-gradient(rgba(255, 255, 255, .1) 15%, transparent 20%) 0 1px, radial-gradient(rgba(255, 255, 255, .1) 15%, transparent 20%) 8px 9px;
      background-color: rgba(0, 0, 0, 0);
      background-size: auto, auto, auto, auto;
      background-color: #282828;
      background-size: 16px 16px;
    }

    .wrapper {}

    #game-list {}

    .game-wrap {
      word-wrap: break-word;
      margin-bottom: 30px;
    }

    .game-wrap.notplayable .game:after {
      content: 'Bug';
      z-index: 3;
      position: absolute;
      right: 0;
      background-color: red;
      color: #fff;
      padding: 6px;
    }

    .logo {
      color: white;
      text-align: center;
    }

    .game {
      display: block;
      position: relative;
      width: 100%;
      height: 438px;
      overflow: hidden;
      background: rgba(0, 0, 0, .8);
    }

    .link-wrap {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      z-index: 1;
    }

    .screenshot {
      padding: 0;
      height: 438px;
      display: block;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .meta {
      color: #fff;
      padding-top: 12px;
    }

    .id {
      position: absolute;
      top: 0;
      left: 0;
      padding: 8px 12px;
      background-color: black;
      color: #fff;
    }

    .links {
      display: table;
      word-break: break-all;
    }

    .links li {
      list-style: none;
    }

    .links li a {
      display: block;
      color: #337ab7;
    }

    .links li a:hover {
      color: #337ab7;
      text-decoration: underline;
    }

    /* Gallery Card Styles */
    .game-wrap {
      margin-bottom: 30px;
    }

    .game-wrap.is-filtered-out {
      display: none !important;
    }

    .game {
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
      height: auto;
      background: #333;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }

    .game:hover {
      transform: translateY(-5px);
    }

    .screenshot {
      width: 100%;
      height: 200px;
      background-position: center;
      background-size: cover;
    }

    .meta {
      width: 100%;
      padding: 15px;
      text-align: center;
      color: #fff;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .phaser-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 12;
      pointer-events: none;
      font-size: 11px;
      font-weight: normal;
      line-height: 1.2;
      color: #e0e0e0;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      padding: 3px 7px;
      white-space: nowrap;
    }

    /* Coming soon (former games0) */
    .game-wrap.coming-soon .game {
      cursor: default;
    }

    .game-wrap.coming-soon .game:hover {
      transform: none;
    }

    .game-wrap.coming-soon .screenshot {
      position: relative;
    }

    .game-wrap.dummy .game {
      cursor: default;
    }

    .game-wrap.dummy .game:hover {
      transform: none;
    }

    .dummy-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 11;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(80, 50, 0, 0.55);
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      pointer-events: none;
    }

    body.admin-mode .game-wrap.dummy .dummy-banner {
      display: none;
    }

    body.admin-mode .game-wrap.dummy .admin-play-link {
      display: block;
    }

    body.admin-mode .game-wrap.dummy .game {
      cursor: pointer;
    }

    body.admin-mode .game-wrap.dummy .game:hover {
      transform: translateY(-5px);
    }

    .coming-soon-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 11;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      pointer-events: none;
    }

    /* Hide elements not needed for gallery view */
    .desc, .links, .id, .game-wrap.notplayable:not(.coming-soon) .game:after {
      display: none;
    }

    /* TOC Styles */
    #toc-container {
      position: fixed;
      top: 62px;
      right: 20px;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.8);
      border: 1px solid #444;
      border-radius: 5px;
      padding: 10px;
      max-width: 250px;
      color: #fff;
      font-family: monospace;
    }

    .toc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 5px;
      user-select: none;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }

    .toc-list.visible {
      display: block;
    }

    .toc-list li {
      margin-bottom: 5px;
    }

    .toc-list a {
      color: #ccc;
      text-decoration: none;
      font-size: 12px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-list a:hover {
      color: #fff;
      text-decoration: underline;
    }

    .toc-list a.active {
      color: #fff;
      font-weight: bold;
      border-left: 2px solid #337ab7;
      padding-left: 5px;
      margin-left: -7px; /* Compensate for border + padding */
    }

    .toc-toggle-btn {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      padding: 0 5px;
    }

    /* Tooltip Styles */
    .info-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 24px;
      height: 24px;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 24px;
      cursor: pointer;
      z-index: 20;
      font-weight: bold;
      font-family: serif;
      user-select: none;
      opacity: 0; /* Hidden by default */
      transition: opacity 0.2s;
    }

    .game:hover .info-icon {
      opacity: 1; /* Show on hover */
    }

    .info-icon:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }

    .game .info-panel {
      position: absolute;
      top: -100%; /* Start hidden above */
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      color: #fff;
      padding: 40px 15px 15px 15px; /* Top padding for close button space */
      transition: top 0.3s ease-in-out;
      z-index: 15;
      overflow-y: auto;
      font-size: 13px;
    }

    .game .info-panel.visible {
      top: 0;
    }

    .info-panel ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .info-panel li {
      margin-bottom: 8px;
      word-break: break-all;
    }

    .info-panel a {
      color: #4db8ff;
      text-decoration: none;
    }

    .info-panel a:hover {
      text-decoration: underline;
    }

    .filter-controls {
      text-align: center;
      margin-bottom: 20px;
      color: white;
    }

    .filter-controls select {
      color: #333;
      padding: 5px 10px;
      border-radius: 4px;
      border: none;
    }

    .section-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .section-tab {
      padding: 8px 18px;
      border: 1px solid #555;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.5);
      color: #ccc;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .section-tab:hover {
      color: #fff;
      border-color: #777;
      background: rgba(40, 40, 40, 0.9);
    }

    .section-tab.active {
      color: #fff;
      border-color: #337ab7;
      background: #337ab7;
    }

    .section-tab .tab-count {
      opacity: 0.85;
      font-size: 11px;
      margin-left: 4px;
    }

    /* Top-right page menu */
    #page-menu {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1100;
      font-family: monospace;
    }

    #page-menu-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background-color: rgba(0, 0, 0, 0.85);
      border: 1px solid #555;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }

    #page-menu-btn:hover {
      background-color: rgba(40, 40, 40, 0.95);
      border-color: #666;
    }

    #page-menu-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 240px;
      padding: 10px 0;
      background-color: rgba(24, 24, 24, 0.98);
      border: 1px solid #444;
      border-radius: 5px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    #page-menu.open #page-menu-panel {
      display: block;
    }

    .page-menu-section {
      padding: 4px 14px 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
    }

    .page-menu-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 14px;
      margin: 0;
      color: #eee;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .page-menu-toggle-row:hover {
      background-color: rgba(255, 255, 255, 0.06);
    }

    .page-menu-toggle-label {
      flex: 1;
      min-width: 0;
    }

    .page-menu-toggle-state {
      font-size: 11px;
      color: #888;
      margin-right: 4px;
      min-width: 22px;
      text-align: right;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #555;
      border-radius: 24px;
      transition: background-color 0.2s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background-color: #337ab7;
    }

    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }

    .toggle-switch input:focus + .toggle-slider {
      box-shadow: 0 0 0 2px rgba(51, 122, 183, 0.5);
    }

    .page-menu-hint {
      margin: 0;
      padding: 6px 14px 10px;
      font-size: 11px;
      line-height: 1.45;
      color: #888;
    }

    .page-menu-hint code {
      color: #bbb;
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 4px;
      border-radius: 3px;
    }

    body.hide-phaser-version-tags .phaser-tag {
      display: none !important;
    }

    /* Admin mode — open coming-soon games for local dev/review */
    body.admin-mode #page-menu-btn {
      border-color: #c9a227;
      box-shadow: 0 0 0 1px rgba(201, 162, 39, 0.35);
    }

    .game-wrap.coming-soon .admin-play-link,
    .game-wrap.dummy .admin-play-link {
      display: none;
    }

    body.admin-mode .game-wrap.coming-soon .coming-soon-banner {
      display: none;
    }

    body.admin-mode .game-wrap.coming-soon .admin-play-link {
      display: block;
    }

    body.admin-mode .game-wrap.coming-soon .game {
      cursor: pointer;
    }

    body.admin-mode .game-wrap.coming-soon .game:hover {
      transform: translateY(-5px);
    }

    body.admin-mode .game-wrap.coming-soon .game:before {
      content: 'Dev';
      z-index: 13;
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: #c9a227;
      color: #111;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="page-menu">
    <button type="button" id="page-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="page-menu-panel">
      <span id="page-menu-label">Menu</span> <span aria-hidden="true">▾</span>
    </button>
    <div id="page-menu-panel" role="menu" aria-labelledby="page-menu-btn" aria-hidden="true">
      <div class="page-menu-section">Game cards</div>
      <label class="page-menu-toggle-row" role="menuitem">
        <span class="page-menu-toggle-label" id="phaser-version-toggle-desc">Phaser version on cards</span>
        <span class="page-menu-toggle-state" id="phaser-version-toggle-state" aria-hidden="true">On</span>
        <span class="toggle-switch">
          <input type="checkbox" id="phaser-version-toggle" aria-describedby="phaser-version-toggle-desc" aria-label="Toggle Phaser version on game cards">
          <span class="toggle-slider"></span>
        </span>
      </label>
      <div class="page-menu-section">Developer</div>
      <label class="page-menu-toggle-row" role="menuitem">
        <span class="page-menu-toggle-label" id="admin-mode-toggle-desc">Admin mode (play WIP / dummy)</span>
        <span class="page-menu-toggle-state" id="admin-mode-toggle-state" aria-hidden="true">Off</span>
        <span class="toggle-switch">
          <input type="checkbox" id="admin-mode-toggle" aria-describedby="admin-mode-toggle-desc" aria-label="Toggle admin mode to open coming soon games">
          <span class="toggle-slider"></span>
        </span>
      </label>
      <p class="page-menu-hint">Opens <code>games/coming-soon/</code> and <code>games/dummy/</code> demos locally. Saved in this browser only.</p>
    </div>
  </div>
  <div id="toc-container">
    <div class="toc-header" onclick="toggleTOC()">
      <span>Table of Contents</span>
      <button class="toc-toggle-btn">▼</button>
    </div>
    <ul id="toc-list" class="toc-list"></ul>
  </div>
  <div class="container wrapper">
    <div class="row">
      <h2 class="logo">Phaser Examples, <span id="ngames">0</span> games</h2>
      <div class="filter-controls">
        <label for="version-select">Filter by Version: </label>
        <select id="version-select">
          <option value="all">All Versions</option>
        </select>
      </div>
      <hr>
      <div class="section-tabs" role="tablist" aria-label="Game section">
        <button type="button" class="section-tab active" role="tab" aria-selected="true" data-section="all" id="section-tab-all">
          All<span class="tab-count" id="section-count-all"></span>
        </button>
        <button type="button" class="section-tab" role="tab" aria-selected="false" data-section="ready" id="section-tab-ready">
          Ready<span class="tab-count" id="section-count-ready"></span>
        </button>
        <button type="button" class="section-tab" role="tab" aria-selected="false" data-section="coming-soon" id="section-tab-coming-soon">
          Coming soon<span class="tab-count" id="section-count-coming-soon"></span>
        </button>
        <button type="button" class="section-tab" role="tab" aria-selected="false" data-section="dummy" id="section-tab-dummy">
          Dummy<span class="tab-count" id="section-count-dummy"></span>
        </button>
      </div>
      <div id="game-list"></div>
    </div>
  </div>
    <script id="game-template" type="text/x-handlebars-template">
        {{#each games}}
        <div id="game-{{#if slug}}{{slug}}{{else}}{{name}}{{/if}}" class="col-xs-12 col-sm-6 col-md-4 col-lg-3 game-wrap{{#if comingSoon}} coming-soon{{/if}}{{#if isDummy}} dummy{{/if}}{{#unless comingSoon}}{{#unless isDummy}}{{#unless isPlayable}} notplayable{{/unless}}{{/unless}}{{/unless}}" data-section="{{section}}" data-phaser-version="{{phaserVersion}}">
            <div class="game">
                <span class="phaser-tag" title="Phaser version">{{phaserVersion}}</span>
                <div class="screenshot" {{#if screenshots.[0]}} style="background-image: url('{{screenshots.[0]}}');" {{/if}}>
                    {{#if comingSoon}}
                    <div class="coming-soon-banner">Coming soon</div>
                    {{#if demos.[0]}}
                    <a class="link-wrap admin-play-link" target="_blank" href="{{demos.[0]}}"></a>
                    {{/if}}
                    {{else}}
                    {{#if isDummy}}
                    <div class="dummy-banner">Dummy</div>
                    {{#if demos.[0]}}
                    <a class="link-wrap admin-play-link" target="_blank" href="{{demos.[0]}}"></a>
                    {{/if}}
                    {{else}}
                    {{#if demos.[0]}}
                    <a class="link-wrap" target="_blank" href="{{demos.[0]}}"></a>
                    {{/if}}
                    {{/if}}
                    {{/if}}
                </div>

                <div class="meta">
                    <div class="title">{{title}}</div>
                </div>

                {{#if references}}
                <div class="info-icon" onclick="toggleInfo(this, event)">i</div>
                <div class="info-panel">
                    <strong>References:</strong>
                    <br><br>
                    <ul>
                        {{#each inspirations}}
                        <li><a href="{{this}}" target="_blank">{{this}}</a></li>
                        {{/each}}
                        {{#each references}}
                        <li><a href="{{this}}" target="_blank">{{this}}</a></li>
                        {{/each}}
                        {{#each tags}}
                        <li class="tag"><a href="{{this}}" target="_blank">{{this}}</a></li>
                        {{/each}}
                    </ul>
                </div>
                {{/if}}
            </div>
        </div>
        {{/each}}
        </div>
    </script>
  <script src="games.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.0.5/handlebars.min.js"></script>
  <script>
    // ================================================================ Function

    function getRepoBasePath() {
      if (window.location.pathname.indexOf('/phaser-examples') !== -1) {
        return '/phaser-examples';
      }
      if (window.location.hostname.indexOf('github.io') !== -1) {
        return '/phaser-examples';
      }
      return '';
    }


    var ADMIN_MODE_KEY = 'phaser-examples-admin-mode';

    function getAdminModePreference() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('admin') === '1') {
        return true;
      }
      return localStorage.getItem(ADMIN_MODE_KEY) === 'on';
    }

    function applyAdminModePreference() {
      var on = getAdminModePreference();
      document.body.classList.toggle('admin-mode', on);
      var label = document.getElementById('page-menu-label');
      if (label) {
        label.textContent = on ? 'Menu · Admin' : 'Menu';
      }
    }

    function syncAdminModeToggle() {
      var toggle = document.getElementById('admin-mode-toggle');
      var stateLabel = document.getElementById('admin-mode-toggle-state');
      if (!toggle) return;
      var on = getAdminModePreference();
      toggle.checked = on;
      if (stateLabel) {
        stateLabel.textContent = on ? 'On' : 'Off';
      }
    }

    function setAdminModePreference(on) {
      localStorage.setItem(ADMIN_MODE_KEY, on ? 'on' : 'off');
      applyAdminModePreference();
      syncAdminModeToggle();
    }

    var PHASER_TAG_PREF_KEY = 'phaser-examples-card-phaser-version';

    function getPhaserTagPreference() {
      var v = localStorage.getItem(PHASER_TAG_PREF_KEY);
      return v === 'hide' ? 'hide' : 'show';
    }

    function applyPhaserTagPreference() {
      document.body.classList.toggle('hide-phaser-version-tags', getPhaserTagPreference() === 'hide');
    }

    function syncPhaserTagToggle() {
      var toggle = document.getElementById('phaser-version-toggle');
      var stateLabel = document.getElementById('phaser-version-toggle-state');
      if (!toggle) return;
      var show = getPhaserTagPreference() === 'show';
      toggle.checked = show;
      if (stateLabel) {
        stateLabel.textContent = show ? 'On' : 'Off';
      }
    }

    function setPhaserTagPreference(show) {
      localStorage.setItem(PHASER_TAG_PREF_KEY, show ? 'show' : 'hide');
      applyPhaserTagPreference();
      syncPhaserTagToggle();
    }

    function setupPageMenu() {
      var root = document.getElementById('page-menu');
      var btn = document.getElementById('page-menu-btn');
      var panel = document.getElementById('page-menu-panel');
      if (!root || !btn || !panel) return;

      function setOpen(open) {
        root.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        panel.setAttribute('aria-hidden', open ? 'false' : 'true');
      }

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        setOpen(!root.classList.contains('open'));
      });

      panel.addEventListener('click', function (e) {
        e.stopPropagation();
      });

      document.addEventListener('click', function () {
        setOpen(false);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          setOpen(false);
        }
      });

      var toggle = document.getElementById('phaser-version-toggle');
      if (toggle) {
        toggle.addEventListener('change', function () {
          setPhaserTagPreference(toggle.checked);
        });
      }

      var adminToggle = document.getElementById('admin-mode-toggle');
      if (adminToggle) {
        adminToggle.addEventListener('change', function () {
          setAdminModePreference(adminToggle.checked);
        });
      }

      syncPhaserTagToggle();
      syncAdminModeToggle();
    }

    // ================================================================ Handlebars

    Handlebars.registerHelper('list', function (items, options) {
      var out = '<ul>';
      for (var i = 0, l = items.length; i < l; i++) {
        out = out + '<li>' + options.fn(items[i]) + '</li>';
      }

      return out + '</ul>';
    });

    // ================================================================ App

    // Setup `games` variable for demo purpose
    var gameTemplateEle = document.getElementById('game-template');
    var gameListEle = document.getElementById('game-list');
    var ngamesEle = document.getElementById('ngames');
    var currentHost = window.location.origin;
    var repoBase = getRepoBasePath();

    function getScreenshotsBase() {
      return currentHost + repoBase + '/screenshots/';
    }

    function resolveScreenshotPath(game, filename) {
      if (!filename) {
        return filename;
      }
      if (filename.indexOf('/') >= 0) {
        return filename;
      }
      return game.section + '/' + filename;
    }
    var gameHostname = currentHost + repoBase + '/games/';
    var gameHostRefname = 'http://jojoee.github.io/phaser-examples';
    gameHostRefname += '/games/';

    function getGameSection(game) {
      var name = game.name || '';
      if (game.comingSoon || name.indexOf('coming-soon/') === 0) {
        return 'coming-soon';
      }
      if (name.indexOf('dummy/') === 0 || game.isDummy) {
        return 'dummy';
      }
      return 'ready';
    }

    function init() {
      for (var i = 0; i < games.length; i++) {
        games[i].section = getGameSection(games[i]);
        games[i].isDummy = games[i].section === 'dummy';

        // Screenshots — screenshots/<section>/<file> (e.g. ready/run.jpg)
        var screenshotsBase = getScreenshotsBase();
        var nScreenshots = games[i].screenshots.length;
        for (var j = 0; j < nScreenshots; j++) {
          var shotPath = resolveScreenshotPath(games[i], games[i].screenshots[j]);
          games[i].screenshots[j] = screenshotsBase + shotPath;
        }

        // Demos — public games get mirror link; coming-soon gets local URL for admin mode
        var selfHostDemo = gameHostname + games[i].name;
        if (games[i].comingSoon || games[i].section === 'dummy') {
          games[i].demos.unshift(selfHostDemo);
        } else {
          var refHostDemo = gameHostRefname + games[i].name;
          games[i].demos.unshift(refHostDemo);
          games[i].demos.unshift(selfHostDemo);
        }
      }

      // start
      var source = gameTemplateEle.innerHTML;
      var template = Handlebars.compile(source);
      var context = {
        games: games
      };
      var html = template(context);

      ngamesEle.innerHTML = games.length
      gameListEle.innerHTML = html;
    }

    if (new URLSearchParams(window.location.search).get('admin') === '1') {
      setAdminModePreference(true);
    }
    applyAdminModePreference();
    applyPhaserTagPreference();
    init()

    setupPageMenu();

    // ================================================================ Filter
    function phaserMajorVersion(versionStr) {
      if (!versionStr) return '';
      var m = String(versionStr).trim().match(/^(\d+)/);
      return m ? m[1] : '';
    }

    function isGameWrapVisible(gameWrap) {
      return !gameWrap.classList.contains('is-filtered-out');
    }

    function populateFilters() {
      var versions = new Set();
      for (var i = 0; i < games.length; i++) {
        var major = phaserMajorVersion(games[i].phaserVersion);
        if (major) {
          versions.add(major);
        }
      }

      var select = document.getElementById('version-select');
      var sortedVersions = Array.from(versions).sort(function (a, b) {
        return parseInt(a, 10) - parseInt(b, 10);
      });

      for (var j = 0; j < sortedVersions.length; j++) {
        var v = sortedVersions[j];
        var opt = document.createElement('option');
        opt.value = v;
        opt.innerText = 'Phaser ' + v;
        select.appendChild(opt);
      }
    }

    var SECTION_TAB_KEY = 'phaser-examples-section-tab';

    function getSectionFilter() {
      var active = document.querySelector('.section-tab.active');
      return active ? active.getAttribute('data-section') : 'all';
    }

    function setSectionFilter(section) {
      var tabs = document.querySelectorAll('.section-tab');
      for (var i = 0; i < tabs.length; i++) {
        var tab = tabs[i];
        var isActive = tab.getAttribute('data-section') === section;
        tab.classList.toggle('active', isActive);
        tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
      }
      localStorage.setItem(SECTION_TAB_KEY, section);
      filterGames();
    }

    function updateSectionTabCounts() {
      var select = document.getElementById('version-select');
      var version = select ? select.value : 'all';
      var gameWraps = document.querySelectorAll('.game-wrap');
      var counts = { all: 0, ready: 0, 'coming-soon': 0, dummy: 0 };

      for (var i = 0; i < gameWraps.length; i++) {
        var gameWrap = gameWraps[i];
        var gameVer = phaserMajorVersion(gameWrap.getAttribute('data-phaser-version'));
        if (version !== 'all' && gameVer !== version) {
          continue;
        }
        var section = gameWrap.getAttribute('data-section');
        counts.all++;
        if (section === 'ready') {
          counts.ready++;
        } else if (section === 'coming-soon') {
          counts['coming-soon']++;
        } else if (section === 'dummy') {
          counts.dummy++;
        }
      }

      var allEl = document.getElementById('section-count-all');
      var readyEl = document.getElementById('section-count-ready');
      var soonEl = document.getElementById('section-count-coming-soon');
      var dummyEl = document.getElementById('section-count-dummy');
      if (allEl) allEl.textContent = ' (' + counts.all + ')';
      if (readyEl) readyEl.textContent = ' (' + counts.ready + ')';
      if (soonEl) soonEl.textContent = ' (' + counts['coming-soon'] + ')';
      if (dummyEl) dummyEl.textContent = ' (' + counts.dummy + ')';
    }

    function filterGames() {
      var select = document.getElementById('version-select');
      var version = select.value;
      var section = getSectionFilter();
      var gameWraps = document.querySelectorAll('.game-wrap');
      var count = 0;

      for (var i = 0; i < gameWraps.length; i++) {
        var gameWrap = gameWraps[i];
        var gameVer = phaserMajorVersion(gameWrap.getAttribute('data-phaser-version'));
        var gameSection = gameWrap.getAttribute('data-section');
        var versionMatch = version === 'all' || gameVer === version;
        var sectionMatch = section === 'all' || gameSection === section;

        if (versionMatch && sectionMatch) {
          gameWrap.classList.remove('is-filtered-out');
          count++;
        } else {
          gameWrap.classList.add('is-filtered-out');
        }
      }

      document.getElementById('ngames').innerText = count;
      updateSectionTabCounts();
      generateTOC();
      updateActiveTOC();
    }

    function setupSectionTabs() {
      var tabs = document.querySelectorAll('.section-tab');
      var saved = localStorage.getItem(SECTION_TAB_KEY);
      if (saved === 'ready' || saved === 'coming-soon' || saved === 'dummy' || saved === 'all') {
        setSectionFilter(saved);
      } else {
        updateSectionTabCounts();
      }

      for (var i = 0; i < tabs.length; i++) {
        tabs[i].addEventListener('click', function () {
          setSectionFilter(this.getAttribute('data-section'));
        });
      }
    }

    function setupVersionFilter() {
      var select = document.getElementById('version-select');
      if (!select) return;
      select.addEventListener('change', filterGames);
    }

    window.filterGames = filterGames;

    function toggleInfo(icon, event) {
      // Prevent triggering the game link if any
      event.stopPropagation();
      event.preventDefault();
      
      var panel = icon.nextElementSibling;
      if (panel.classList.contains('visible')) {
        panel.classList.remove('visible');
        icon.innerText = 'i';
        icon.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
      } else {
        panel.classList.add('visible');
        icon.innerText = 'x';
        icon.style.backgroundColor = 'rgba(200, 0, 0, 0.8)';
        
        // Add listener to close on mouseleave
        var gameCard = icon.closest('.game');
        var closeOnLeave = function() {
            panel.classList.remove('visible');
            icon.innerText = 'i';
            icon.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
            gameCard.removeEventListener('mouseleave', closeOnLeave);
        };
        gameCard.addEventListener('mouseleave', closeOnLeave);
      }
    }

    // ================================================================ TOC
    function generateTOC() {
      var tocList = document.getElementById('toc-list');
      tocList.innerHTML = ''; // Clear existing
      
      // Select games after they are rendered
      var games = document.querySelectorAll('.game-wrap');

      for (var i = 0; i < games.length; i++) {
        var game = games[i];
        // Skip hidden games
        if (!isGameWrapVisible(game)) continue;
        
        var id = game.id;
        // The title is inside .meta .title
        var titleEl = game.querySelector('.title');
        if (titleEl) {
          var title = titleEl.innerText;
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = '#' + id;
          a.innerText = title;
          a.title = title;
          li.appendChild(a);
          tocList.appendChild(li);
        }
      }
    }

    function toggleTOC() {
      var list = document.getElementById('toc-list');
      var btn = document.querySelector('.toc-toggle-btn');
      if (list.style.display === 'block') {
        list.style.display = 'none';
        btn.innerText = '▼';
      } else {
        list.style.display = 'block';
        btn.innerText = '▲';
      }
    }

    function updateActiveTOC() {
      var games = document.querySelectorAll('.game-wrap');
      var scrollPos = window.scrollY || document.documentElement.scrollTop;
      var offset = 150; // Offset to trigger earlier

      var currentId = '';

      for (var i = 0; i < games.length; i++) {
        var game = games[i];
        // Skip hidden games
        if (!isGameWrapVisible(game)) continue;

        // Check if the game is near the top of the viewport
        if (game.offsetTop <= scrollPos + offset) {
          currentId = game.id;
        }
      }

      var links = document.querySelectorAll('.toc-list a');
      for (var i = 0; i < links.length; i++) {
        links[i].classList.remove('active');
        if (currentId && links[i].getAttribute('href') === '#' + currentId) {
          links[i].classList.add('active');
          // Scroll TOC to keep active item in view
          links[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        }
      }
    }

    // Generate TOC after init
    populateFilters();
    setupSectionTabs();
    setupVersionFilter();
    generateTOC();
    
    // Scroll Spy
    window.addEventListener('scroll', updateActiveTOC);
    updateActiveTOC(); // Initial check
  </script>
</body>

</html>
